# fly.toml app configuration file generated for upsolve-it--backend on 2026-07-05T07:54:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'upsolve-it--backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
