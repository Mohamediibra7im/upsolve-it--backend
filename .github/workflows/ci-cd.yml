name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Build NestJS app
      run: npm run build
      env:
        NODE_ENV: production
        PORT: 5000
        FRONTEND_ORIGIN: http://localhost:3000
        JWT_SECRET: ci-test-secret-at-least-32-characters
        JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32
        MONGODB_URI: mongodb://localhost:27017/test
